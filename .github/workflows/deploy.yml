name: SecureShare CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

  client-build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build

  deploy-ec2:
    needs: [test, client-build]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through AWS SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0700bb9b4bc846f3b \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/SecureShare",
              "git pull origin main",
              "cd /home/ubuntu/SecureShare/client",
              "npm ci",
              "npm run build",
              "cd /home/ubuntu/SecureShare/server",
              "npm ci --omit=dev",
              "pm2 restart secureshare",
              "pm2 save"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0700bb9b4bc846f3b

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0700bb9b4bc846f3b

      - name: Check API health
        run: |
          sleep 5
          curl --fail --silent --show-error https://api.srikesav.site/api/health

  deploy-vercel:
    needs: [test, client-build]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: client
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel production bundle
        working-directory: client
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy frontend to Vercel
        working-directory: client
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
