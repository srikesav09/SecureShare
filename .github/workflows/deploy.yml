name: SecureShare CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

  client-build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Create cPanel ZIP
        run: cd dist && zip -r ../secureshare-ui-dist.zip .

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureshare-client-dist
          path: client/dist

      - name: Upload cPanel ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureshare-ui-zip
          path: client/secureshare-ui-dist.zip

  deploy-ec2:
    needs: [test, client-build]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through AWS SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0700bb9b4bc846f3b \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/SecureShare",
              "git pull origin main",
              "cd /home/ubuntu/SecureShare/client",
              "npm ci",
              "npm run build",
              "cd /home/ubuntu/SecureShare/server",
              "npm ci --omit=dev",
              "pm2 restart secureshare",
              "pm2 save"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0700bb9b4bc846f3b

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0700bb9b4bc846f3b

      - name: Check API health
        run: |
          sleep 5
          curl --fail --silent --show-error https://api.srikesav.site/api/health

  deploy-cpanel:
    if: ${{ vars.CPANEL_DEPLOY == 'true' }}
    needs: client-build
    runs-on: ubuntu-latest

    steps:
      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: secureshare-client-dist
          path: client/dist

      - name: Deploy client to cPanel by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: client/dist/
          server-dir: /public_html/secureshare/dist/
